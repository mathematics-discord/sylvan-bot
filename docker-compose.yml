services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DB__PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB__DATABASE:-ratbot}
      POSTGRES_USER: ${DB__USER:-postgres}
      POSTGRES_PASSWORD: ${DB__PASSWORD:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB__USER:-postgres} -d ${DB__DATABASE:-ratbot}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot-network

volumes:
  postgres_data:
    name: ratbot_postgres_data

networks:
  bot-network:
    name: ratbot_network
