[tool.towncrier]
name = "ratbot"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} - {project_date}"
issue_format = ""
wrap = false

[[tool.towncrier.type]]
directory = "security"
name = "Security"

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"

[[tool.towncrier.type]]
directory = "added"
name = "Added"

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
