changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md

versionExt: md
versionFileFormat: 'v{{.VersionNoPrefix}}.md'
versionFormat: '# v{{.VersionNoPrefix}} - {{.Time.Format "2006-01-02"}}'

componentFormat: '## {{.Component}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'

body:
  maxLength: 600
  block: true

components:
  - General
  - Administration
  - Moderation
  - Internal

kinds:
  - label: Security
  - label: Added
  - label: Changed
  - label: Fixed
  - label: Deprecated
  - label: Removed

newlines:
  beforeChangelogVersion: 1
  afterChangelogVersion: 0
  beforeComponent: 0
  afterComponent: 0
  beforeKind: 0
  afterKind: 0
  beforeChange: 0
  afterChange: 0
  endOfVersion: 0
