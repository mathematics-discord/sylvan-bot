changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md

versionExt: md
versionFileFormat: 'v{{.VersionNoPrefix}}.md'
versionFormat: '## v{{.VersionNoPrefix}} - {{.Time.Format "2006-01-02"}}'

componentFormat: '### {{.Component}}'
kindFormat: '#### {{.Kind}}'
changeFormat: '- {{.Body}}'

body:
  maxLength: 300
  block: true

components:
  - General
  - Administration
  - Moderation

kinds:
  - label: Security
  - label: Added
  - label: Changed
  - label: Fixed
  - label: Deprecated
  - label: Removed

newlines:
  beforeChangelogVersion: 1
  beforeComponent: 1
  afterComponent: 1
  beforeKind: 1
  afterKind: 1
  endOfVersion: 1