name: CodeQL

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - master
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      source_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, csharp, python]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          ref: ${{ inputs.source_ref || github.ref }}
          sha: ${{ inputs.source_sha || github.sha }}
          wait-for-processing: true
