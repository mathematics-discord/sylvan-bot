name: Deploy Sylvan Bot to VPS

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-sylvan-bot
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.detect.outputs.has_release }}
      version: ${{ steps.detect.outputs.version }}
      image_tag: ${{ steps.detect.outputs.image_tag }}
      source_sha: ${{ steps.detect.outputs.source_sha }}
      before_sha: ${{ steps.detect.outputs.before_sha }}
    steps:
      - name: Check out pushed commit and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.after }}
          fetch-depth: 0

      - name: Detect committed release batch
        id: detect
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
          RELEASE_AFTER: ${{ github.event.after }}
        run: python3 scripts/detect-release.py

  scan-release:
    needs: release
    if: needs.release.outputs.has_release == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      source_sha: ${{ needs.release.outputs.source_sha }}
      source_ref: refs/heads/master

  build-and-push:
    needs:
      - release
      - scan-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.source_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ needs.release.outputs.source_sha }}
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.image_tag }}
            ghcr.io/${{ github.repository }}:master

  deploy-production:
    needs:
      - release
      - build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.source_sha }}

      - name: Deploy production
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          IMAGE_REF: ghcr.io/${{ github.repository }}:sha-${{ needs.release.outputs.source_sha }}
        run: |
          bash scripts/deploy-vps-stack.sh \
            --project sylvan-bot-production \
            --remote-dir /opt/sylvan-bot/production \
            --image-ref "$IMAGE_REF"

  announce-release:
    needs:
      - release
      - deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit and history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.source_sha }}
          fetch-depth: 0

      - name: Announce deployed release
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          DEPLOY_RESULT: ${{ needs.deploy-production.result }}
          RELEASE_BEFORE: ${{ needs.release.outputs.before_sha }}
          RELEASE_AFTER: ${{ needs.release.outputs.source_sha }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: python3 scripts/announce-release.py
