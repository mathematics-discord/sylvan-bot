name: Verify Codex gate release bypass (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out trusted master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Push only to the disposable protected probe branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/rulesets/25256395" --jq '{bypass_actors, current_user_can_bypass}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'Disposable release-token bypass verification'
          git push origin HEAD:refs/heads/verification/codex-release-push
