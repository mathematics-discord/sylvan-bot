services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB__DATABASE}
      POSTGRES_USER: ${DB__USER}
      POSTGRES_PASSWORD: ${DB__PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB__USER} -d ${DB__DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_internal

  bot:
    image: ${SYLVAN_BOT_IMAGE:-sylvan-bot:production}
    pull_policy: always
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DISCORD__TOKEN: ${DISCORD__TOKEN}
      DISCORD__MESSAGECACHESIZE: ${DISCORD__MESSAGECACHESIZE:-0}
      EMOJIANALYTICS__ENABLEDGUILDIDS__0: ${EMOJIANALYTICS__ENABLEDGUILDIDS__0}
      DB__HOST: postgres
      DB__PORT: "5432"
      DB__DATABASE: ${DB__DATABASE}
      DB__USER: ${DB__USER}
      DB__PASSWORD: ${DB__PASSWORD}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_internal

volumes:
  postgres_data:
    name: sylvan-bot-production-postgres-data

networks:
  app_internal:
    name: sylvan-bot-production-internal
