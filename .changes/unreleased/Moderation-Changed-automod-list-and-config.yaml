component: Moderation
kind: Changed
body: >-
  Senior Moderators: show automod rules in a public paginated list with up to
  20 entries per page and spoilered patterns. Administrators: split automod
  configuration into set, exempt and show; choose an action from the selector
  or omit it to enable or disable all four actions together.
